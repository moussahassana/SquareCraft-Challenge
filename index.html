<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SquareCraft-Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 p-4">
  <div id="setupModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
      <h2 class="text-3xl font-bold mb-6 text-center text-slate-800">SquareCraft-Challenge</h2>
      <p class="text-slate-600 text-center mb-6">Enter player names to begin</p>

      <div class="mb-4">
        <label class="block text-sm font-semibold text-slate-700 mb-2">Player 1 Name</label>
        <input type="text" id="player1Input" placeholder="Enter name" maxlength="20" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
        <p class="text-xs text-slate-500 mt-1 player-1-color">Color: Coral</p>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-semibold text-slate-700 mb-2">Player 2 Name</label>
        <input type="text" id="player2Input" placeholder="Enter name" maxlength="20" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p class="text-xs text-slate-500 mt-1 player-2-color">Color: Azure</p>
      </div>

      <button id="startBtn" class="w-full bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold py-3 rounded-lg transition-all duration-200 transform hover:scale-105">Start Game</button>
    </div>
  </div>

  <div id="gameContainer" class="hidden flex flex-col items-center">
    <div class="mb-6 text-center">
      <h1 class="text-4xl font-bold mb-2 text-white">SquareCraft-Challenge</h1>
      <p class="text-slate-300 text-sm">Place dots to form squares</p>
    </div>

    <div class="bg-white rounded-lg shadow-2xl p-6 mb-6">
      <div id="grid"></div>
    </div>

    <div class="w-full max-w-md text-center">
      <p id="turnIndicator" class="text-lg font-semibold text-white mb-3"></p>
      <p id="scoreBoard" class="text-lg text-slate-300 mb-2"></p>
      <p id="gridLength" class="text-sm text-slate-400 mb-4">Grid: 10 × 10</p>
      <p id="gameOverMessage" class="text-2xl font-bold mb-4 hidden"></p>
      <button id="restartBtn" class="px-6 py-2 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-lg font-semibold transition-all duration-200 transform hover:scale-105 hidden">Play Again</button>
    </div>
  </div>

  <script src="assets/js/game.js"></script>
</body>
</html>
