<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SquareCraft-Challenge - Setup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 p-4">
  <div id="setupModal" class="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
    <h2 class="text-3xl font-bold mb-6 text-center text-slate-800">SquareCraft-Challenge</h2>
    <p class="text-slate-600 text-center mb-6">Enter player names to begin</p>

    <div class="mb-6">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Game Mode</label>
      <div class="flex items-center space-x-4">
        <label class="flex items-center cursor-pointer">
          <input type="radio" name="gameMode" value="pvp" checked class="mr-2">
          <span class="text-slate-700">Player vs Player</span>
        </label>
        <label class="flex items-center cursor-pointer">
          <input type="radio" name="gameMode" value="pva" class="mr-2">
          <span class="text-slate-700">Player vs AI</span>
        </label>
      </div>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Grid Size</label>
      <select id="gridSizeSelect" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-500 bg-white cursor-pointer">
        <option value="15">15 × 15</option>
        <option value="20">20 × 20</option>
        <option value="25">25 × 25</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Player 1 Name</label>
      <input type="text" id="player1Input" placeholder="Enter name" maxlength="20" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
      <div class="mt-2 flex items-center space-x-2">
        <label class="text-sm text-slate-600 font-medium">Color:</label>
        <input type="color" id="player1Color" value="#ff6b4a" class="w-8 h-8 rounded cursor-pointer border-none p-0 outline-none">
      </div>
    </div>

    <div id="player2Section" class="mb-6">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Player 2 Name</label>
      <input type="text" id="player2Input" placeholder="Enter name" maxlength="20" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div class="mt-2 flex items-center space-x-2">
        <label class="text-sm text-slate-600 font-medium">Color:</label>
        <input type="color" id="player2Color" value="#3b82f6" class="w-8 h-8 rounded cursor-pointer border-none p-0 outline-none">
      </div>
    </div>

    <button id="startBtn" class="w-full bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold py-3 rounded-lg transition-all duration-200 transform hover:scale-105">Start Game</button>
  </div>

  <script src="assets/js/setup.js"></script>
</body>
</html>
